<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défis photo · Point of Nabil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E9E6; --card:#F6F8F6; --ink:#18231F; --soft:#4E5E57;
  --green:#24453A; --gilt:#A9832A; --sage:#B9CBC1; --line:#C9D4CE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111815; --card:#19221E; --ink:#E2E9E5; --soft:#9DB0A7;
    --green:#9CC7B2; --gilt:#D9B658; --sage:#2C3B34; --line:#2A3631;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111815; --card:#19221E; --ink:#E2E9E5; --soft:#9DB0A7;
  --green:#9CC7B2; --gilt:#D9B658; --sage:#2C3B34; --line:#2A3631;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1rem; line-height:1.5;
}
.wrap{max-width:40rem; margin:0 auto; padding:1.5rem 1.25rem 3rem}
header{display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:1.25rem}
header h1{font-family:"Young Serif",Georgia,serif; font-weight:400; font-size:1.25rem; margin:0; color:var(--green)}
header .stats{font-size:.875rem; color:var(--soft); font-variant-numeric:tabular-nums; text-align:right}
header .stats b{color:var(--ink); font-weight:600}

/* Le viseur : l'élément marquant */
.viewfinder{position:relative; background:var(--card); padding:2.25rem 1.75rem 1.5rem; margin-bottom:1.25rem}
.viewfinder::before,.viewfinder::after,.vf-b::before,.vf-b::after{
  content:""; position:absolute; width:1.5rem; height:1.5rem; border-color:var(--gilt); border-style:solid;
}
.viewfinder::before{top:.6rem; left:.6rem; border-width:2px 0 0 2px}
.viewfinder::after{top:.6rem; right:.6rem; border-width:2px 2px 0 0}
.vf-b::before{bottom:.6rem; left:.6rem; border-width:0 0 2px 2px}
.vf-b::after{bottom:.6rem; right:.6rem; border-width:0 2px 2px 0}
.kind{display:flex; gap:.75rem; align-items:center; font-size:.875rem; color:var(--soft); margin-bottom:.5rem}
.dots{display:inline-flex; gap:3px}
.dots i{width:.5rem; height:.5rem; border-radius:50%; border:1.5px solid var(--gilt)}
.dots i.on{background:var(--gilt)}
.challenge h2{font-family:"Young Serif",Georgia,serif; font-weight:400; font-size:clamp(1.75rem,6vw,2.5rem); line-height:1.1; margin:0 0 1rem; color:var(--green)}
.challenge.enter h2{animation:focus .5s ease-out}
@keyframes focus{from{filter:blur(6px); opacity:.3}to{filter:blur(0); opacity:1}}
@media (prefers-reduced-motion: reduce){.challenge.enter h2{animation:none}}
.brief{font-size:1.0625rem; margin:0 0 1.25rem; max-width:34em}
.block{border-top:1px solid var(--line); padding-top:.75rem; margin-top:.75rem}
.block h3{font-size:.875rem; font-weight:600; margin:0 0 .15rem; color:var(--soft)}
.block p{margin:0}
.exif{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:1.25rem}
.exif span{font-size:.8125rem; font-variant-numeric:tabular-nums; padding:.2rem .55rem; border:1px solid var(--line); border-radius:3px}

.actions{display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:2rem}
button{font:inherit; cursor:pointer}
.btn{padding:.75rem 1.2rem; border-radius:999px; border:1.5px solid var(--green); background:transparent; color:var(--green); font-weight:600}
.btn.primary{background:var(--green); color:var(--card)}
.btn:disabled{opacity:.5; cursor:default}
:focus-visible{outline:3px solid var(--gilt); outline-offset:2px}

details{border-top:1px solid var(--line); padding:.9rem 0}
summary{cursor:pointer; font-weight:600}
.group{margin:.9rem 0 .4rem}
.group > span{display:block; font-size:.875rem; color:var(--soft); margin-bottom:.35rem}
.chips{display:flex; flex-wrap:wrap; gap:.4rem}
.chip{padding:.4rem .8rem; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.9375rem}
.chip[aria-pressed="true"]{background:var(--sage); border-color:var(--green); color:var(--ink)}
.history{list-style:none; padding:0; margin:.75rem 0 0}
.history li{display:flex; justify-content:space-between; gap:1rem; padding:.45rem 0; border-bottom:1px solid var(--line); font-size:.9375rem}
.history time{color:var(--soft); white-space:nowrap; font-variant-numeric:tabular-nums}
.empty{color:var(--soft); font-size:.9375rem}
.note{font-size:.8125rem; color:var(--soft); margin-top:2rem}
.linkbtn{background:none; border:0; color:var(--soft); text-decoration:underline; padding:0; font-size:.8125rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Défis photo</h1>
    <div class="stats" id="stats"></div>
  </header>

  <section class="viewfinder" aria-live="polite">
    <div class="vf-b"></div>
    <article class="challenge" id="challenge"></article>
  </section>

  <div class="actions">
    <button class="btn primary" id="done">Je l’ai fait</button>
    <button class="btn" id="next">Autre défi</button>
    <button class="btn" id="today">Défi du jour</button>
  </div>

  <details open>
    <summary>Mes réglages</summary>
    <div class="group"><span>Thèmes</span><div class="chips" id="themes"></div></div>
    <div class="group"><span>Difficulté</span><div class="chips" id="levels"></div></div>
    <div class="group"><span>Appareil du jour</span><div class="chips" id="cams"></div></div>
  </details>

  <details>
    <summary>Défis réalisés</summary>
    <ul class="history" id="history"></ul>
  </details>

  <p class="note">Pour les photos au travail ou de passants, demande toujours l’accord des personnes reconnaissables. <button class="linkbtn" id="reset">Effacer mon historique</button></p>
</div>

<script>
const THEMES = {nancy:"Nancy", boulot:"Boulot", famille:"Avec mon fils", loisirs:"Mes passions", technique:"Technique pure"};
const LEVELS = {1:"Facile", 2:"Moyen", 3:"Costaud"};
const CAMS = {m50:"EOS M50", r6:"R6 Mark II"};

const D = [
 {id:"n1",t:"nancy",n:1,titre:"Les grilles d’or",brief:"Place Stanislas : oublie la vue d’ensemble. Isole un seul détail des grilles dorées de Jean Lamour, assez près pour qu’on ne reconnaisse plus la place.",astuce:"Ouvre grand pour flouter l’arrière-plan, et cherche un fond sombre derrière le doré.",reg:["Priorité ouverture","f/2 à f/4","ISO auto"]},
 {id:"n2",t:"nancy",n:2,nuit:true,titre:"L’heure bleue sur Stan",brief:"Reviens place Stanislas 20 à 30 minutes après le coucher du soleil, quand le bleu du ciel équilibre les lumières des façades.",astuce:"Cale l’appareil sur un muret ou un sac, retardateur 2 s pour ne pas bouger.",reg:["f/8","ISO 100–400","Pose de 1 à 4 s"]},
 {id:"n3",t:"nancy",n:1,titre:"Art nouveau en cinq détails",brief:"Autour de la Villa Majorelle ou dans le quartier Saurupt, ramène une série de cinq détails : ferronnerie, vitrail, poignée, motif végétal, et un au choix.",astuce:"Garde le même cadrage carré pour les cinq : ça fera un carrousel Instagram cohérent.",reg:["50 mm","f/4","Format 1:1"]},
 {id:"n4",t:"nancy",n:2,mois:[10,11,12,1,2],titre:"Brume à la Pépinière",brief:"Un matin de brouillard, va au parc de la Pépinière et photographie une silhouette (arbre, banc, promeneur) qui se dissout dans la brume.",astuce:"Le posemètre voit gris : corrige l’exposition de +2/3 à +1 IL pour garder une brume blanche.",reg:["Correction +2/3 IL","f/5.6","Tôt le matin"]},
 {id:"n5",t:"nancy",n:2,titre:"Le reflet d’abord",brief:"Au port Sainte-Catherine ou le long du canal, fais une photo où le reflet dans l’eau est le vrai sujet, et le « réel » seulement un indice.",astuce:"Baisse-toi au ras de l’eau et fais la mise au point sur le reflet, pas sur la surface.",reg:["f/8","Mise au point manuelle"]},
 {id:"n6",t:"nancy",n:1,titre:"La Craffe sans carte postale",brief:"Photographie la Porte de la Craffe, mais la vue frontale classique est interdite : contre-plongée, cadre dans le cadre, ou un fragment de pierre de tout près.",astuce:"Fais d’abord la carte postale pour t’en débarrasser, puis tourne autour pendant 10 minutes.",reg:["Libre"]},
 {id:"n7",t:"nancy",n:3,titre:"Grande Rue, la vie qui passe",brief:"Choisis un beau décor de la Vieille Ville et attends qu’un passant le traverse. Le décor est net, le passant est un flou de mouvement.",astuce:"Les passants restent ainsi non reconnaissables : pratique pour publier.",reg:["Priorité vitesse","1/15 s","f/8","Appui stable"]},
 {id:"n8",t:"nancy",n:2,nuit:true,mois:[11,12],titre:"Saint-Nicolas arrive",brief:"Pendant les fêtes de Saint-Nicolas, ne photographie pas le char : cherche une émotion ou une lumière (un enfant qui regarde, des lampions, des confettis dans un phare).",astuce:"Passe en AF Servo et rafale, les expressions durent une demi-seconde.",reg:["f/1.8 à f/2.8","1/250 s mini","ISO auto"]},
 {id:"n9",t:"nancy",n:1,titre:"Symétrie parfaite",brief:"Sous l’Arc Héré ou face à un bâtiment de la place de la Carrière, réalise une image rigoureusement symétrique, centrée au millimètre.",astuce:"Active la grille de l’écran et le niveau électronique.",reg:["f/8","Grille affichée"]},
 {id:"n10",t:"nancy",n:3,titre:"Nancy en une couleur",brief:"Pendant une balade, ramène six photos où domine la même couleur : le doré de Stan, le vert des vitraux, le rouge d’une enseigne…",astuce:"Choisis la couleur avant de partir, sinon tu ne la verras pas.",reg:["Série de 6","Libre"]},
 {id:"n11",t:"nancy",n:2,titre:"Couleurs du marché",brief:"Au Marché central, compose une image avec les couleurs des étals et, si le commerçant est d’accord, ses mains au travail.",astuce:"Demander « je peux photographier votre étal ? » ouvre souvent une vraie conversation.",reg:["50 mm","f/2.8","1/250 s"]},
 {id:"n12",t:"nancy",n:2,titre:"Au plus près",brief:"Au jardin botanique Jean-Marie Pelt, photographie une plante à la distance minimale de mise au point de ton objectif, pour en faire un paysage abstrait.",astuce:"À cette distance, la profondeur de champ est infime : ferme un peu à f/4 ou f/5.6.",reg:["Distance mini","f/4 à f/5.6"]},

 {id:"b1",t:"boulot",n:1,titre:"Nature morte de bureau",brief:"Ton poste de travail en nature morte : trois objets maximum, éclairés par la lumière latérale d’une fenêtre.",astuce:"Retire tout le reste du cadre. Le vide fait la photo.",reg:["f/2.8","Lumière de fenêtre"]},

 {id:"b3",t:"boulot",n:3,titre:"Les mains qui travaillent",brief:"Lors d’une visite en entreprise, avec l’accord des personnes, photographie des mains en action : atelier, cuisine, chantier, laboratoire.",astuce:"Propose d’envoyer les photos à l’entreprise : ça fait plaisir et ça entretient la relation.",reg:["50 mm","1/250 s","f/2.8","Accord obligatoire"]},
 {id:"b4",t:"boulot",n:2,titre:"Portrait d’un recruteur",brief:"Avec son accord, fais le portrait d’un recruteur ou d’un chef d’entreprise dans son lieu de travail, en lumière naturelle.",astuce:"Fais parler la personne de son métier pendant que tu cadres : le visage se détend.",reg:["50 mm","f/2","Mise au point sur l’œil"]},
 {id:"b5",t:"boulot",n:1,titre:"Lignes de fuite",brief:"Un couloir, un escalier, un open space vide : trouve une ligne de fuite qui guide l’œil vers le fond de l’image.",astuce:"Place le point de fuite sur un tiers plutôt qu’au centre, pour voir la différence.",reg:["f/5.6","Grille affichée"]},
 {id:"b6",t:"boulot",n:2,titre:"Enseignes locales",brief:"Une série de trois logos ou enseignes d’entreprises que tu croises, photographiés comme des formes graphiques plutôt que comme des panneaux.",astuce:"Cherche un angle fort et un ciel uni derrière.",reg:["Série de 3","f/8"]},
 {id:"b7",t:"boulot",n:1,titre:"La pause café",brief:"Ta tasse en contre-jour, avec la vapeur qui monte sur un fond sombre.",astuce:"La vapeur n’est visible qu’éclairée par derrière. Sous-expose un peu.",reg:["Correction −2/3 IL","f/2"]},

 {id:"f1",t:"famille",n:1,titre:"À hauteur d’enfant",brief:"Toute la séance, reste à la hauteur des yeux de ton fils, accroupi ou assis. Pas une seule photo prise debout.",astuce:"Tu verras le monde comme lui : les adultes deviennent des géants.",reg:["50 mm","f/2.8","AF Servo"]},
 {id:"f2",t:"famille",n:2,titre:"Le petit photographe",brief:"Prête-lui le M50 : il choisit un sujet, et toi tu le photographies en train de photographier.",astuce:"Montrez-vous ensuite vos photos respectives et choisissez chacun votre préférée.",reg:["Libre"]},
 {id:"f3",t:"famille",n:2,titre:"Douze images qui bougent",brief:"Préparez ensemble une courte séquence de stop motion : douze photos d’un jouet qui traverse la table.",astuce:"Tout en manuel (exposition, mise au point, balance des blancs), sinon l’animation va scintiller.",reg:["Mode M","MF","Balance des blancs fixe","Trépied"]},
 {id:"f4",t:"famille",n:1,titre:"Le décor de la petite souris",brief:"Photographie la mini porte de la petite souris comme un décor de film : objectif au ras du sol, petite profondeur de champ, lumière chaude.",astuce:"Une guirlande ou une bougie LED en arrière-plan donnera de jolis bokehs.",reg:["f/1.8","Au ras du sol"]},
 {id:"f5",t:"famille",n:2,titre:"Portrait sans visage",brief:"Raconte qui est ton fils sans montrer son visage : ses mains, ses chaussures, ses jouets, son ombre.",astuce:"C’est aussi la meilleure façon de publier en ligne sans exposer un enfant.",reg:["Série de 3","Libre"]},
 {id:"f6",t:"famille",n:3,titre:"Rafale au parc",brief:"Fige ton fils en pleine course, saut ou glissade, net et les pieds décollés du sol.",astuce:"Mets-toi dans l’axe de sa course : l’autofocus suit mieux qu’en travers.",reg:["AF Servo","Rafale","1/1000 s"]},
 {id:"f7",t:"famille",n:1,titre:"Partie de Croque-Carotte",brief:"Pendant une partie, capture le moment où un lapin tombe dans un trou, et la réaction autour de la table.",astuce:"Vue plongeante au-dessus du plateau pour l’action, puis à hauteur des joueurs pour la réaction.",reg:["f/2.8","1/250 s"]},

 {id:"l1",t:"loisirs",n:2,titre:"Mangas en clair-obscur",brief:"Une étagère ou un seul tome de ta collection, éclairé par une seule lampe dans une pièce sombre.",astuce:"Éclaire de côté et rasant pour faire ressortir les reliefs des tranches.",reg:["f/4","Une seule source"]},
 {id:"l2",t:"loisirs",n:3,nuit:true,titre:"Craie et sueur",brief:"À la salle de CrossFit, fige un mouvement au moment où la magnésie s’envole des mains.",astuce:"Pré-règle la mise au point sur la zone de l’action et attends le geste.",reg:["1/1000 s","f/2","ISO auto"]},
 {id:"l3",t:"loisirs",n:2,titre:"Autoportrait du photographe",brief:"Toi et ton appareil : dans un miroir, une vitrine ou au retardateur, dans un lieu qui te ressemble.",astuce:"Utilise l’appli Canon Camera Connect pour déclencher depuis ton téléphone.",reg:["Retardateur 10 s","f/2.8"]},
 {id:"l4",t:"loisirs",n:1,titre:"Photo produit maison",brief:"Photographie ton propre appareil comme pour une pub : fond uni, une lumière, un reflet maîtrisé.",astuce:"Une feuille blanche face à la fenêtre suffit comme réflecteur.",reg:["f/8","ISO 100","Trépied ou appui"]},

 {id:"t1",t:"technique",n:1,titre:"Zoome avec tes pieds",brief:"Aujourd’hui, uniquement le 50 mm. Pour chaque sujet, fais trois photos : loin, à mi-distance, très près.",astuce:"Compare ensuite : laquelle raconte le mieux ?",reg:["50 mm uniquement"]},
 {id:"t2",t:"technique",n:2,titre:"Le filé",brief:"Suis un vélo, une voiture ou un tram en mouvement : le sujet net, le décor qui file.",astuce:"Pivote les hanches avec le sujet et continue le mouvement après le déclenchement.",reg:["Priorité vitesse","1/30 s","AF Servo"]},
 {id:"t3",t:"technique",n:2,titre:"Silhouette",brief:"Un contre-jour assumé : un sujet totalement noir découpé sur un ciel lumineux.",astuce:"Mesure la lumière sur le ciel, pas sur le sujet.",reg:["Mesure spot sur le ciel","f/8"]},
 {id:"t4",t:"technique",n:3,nuit:true,titre:"Traînées de lumière",brief:"De nuit, au bord d’une avenue, transforme les phares en lignes de lumière.",astuce:"Lance la pose juste avant qu’une voiture n’entre dans le cadre.",reg:["Mode M","10 à 20 s","f/11","ISO 100","Trépied"]},
 {id:"t5",t:"technique",n:1,titre:"Tiers, puis rien",brief:"Même sujet, deux photos : une parfaitement selon la règle des tiers, une qui la casse volontairement. Garde celle que tu préfères.",astuce:"Il n’y a pas de bonne réponse, juste une intention.",reg:["Grille affichée"]},
 {id:"t6",t:"technique",n:2,titre:"Manuel intégral",brief:"Une sortie entière en mode M, ISO compris, sans aucune automatisme.",astuce:"Retiens la règle du « 16 au soleil » : f/16, ISO 100, 1/100 s par grand soleil.",reg:["Mode M","ISO fixe"]},
 {id:"t7",t:"technique",n:2,titre:"Voir en noir et blanc",brief:"Passe le style d’image en monochrome et ne photographie que des textures et des contrastes.",astuce:"Shoote en RAW : l’écran est en noir et blanc, mais tu gardes la couleur au besoin.",reg:["Style Monochrome","RAW"]},
 {id:"t8",t:"technique",n:3,titre:"Une seule photo",brief:"Tu n’as droit qu’à un seul déclenchement pour toute la journée. Choisis bien.",astuce:"Pense ta photo pendant des heures avant de l’oser.",reg:["1 déclenchement"]}
];

const BONUS = ["Format vertical 4:5 pour Instagram","Mise au point manuelle uniquement","Dix photos maximum","Aucun visage reconnaissable","Uniquement en noir et blanc","Avant 9 h ou après 17 h","Une seule couleur dominante","Au moins une photo en contre-plongée"];

const CAM_NOTE = {
  m50:{nuit:"Sur le M50, essaie de rester sous 3200 ISO, le bruit monte vite au-delà.", jour:"Avec le M50, ton 50 mm cadre comme un 80 mm : recule d’un pas."},
  r6:{nuit:"Le R6 II encaisse 12 800 ISO sans souci : n’aie pas peur de monter.", jour:"Avec le R6 II, ton 50 mm cadre large et naturel : rapproche-toi du sujet."}
};

const KEY = "defis-photo-v1";
let state = {themes:Object.keys(THEMES), levels:["1","2","3"], cam:"m50", history:[]};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const month = new Date().getMonth()+1;
const inSeason = c => !c.mois || c.mois.includes(month);
const dayKey = (d=new Date()) => d.toISOString().slice(0,10);
function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; }

let current = null, currentBonus = null;

function pool(){
  return D.filter(c => inSeason(c) && state.themes.includes(c.t) && state.levels.includes(String(c.n)));
}
function pickToday(){
  const p = D.filter(inSeason);
  const h = hash(dayKey());
  current = p[h % p.length]; currentBonus = BONUS[h % BONUS.length];
  render();
}
function pickRandom(){
  let p = pool();
  if(!p.length){ current = null; render(); return; }
  const doneIds = new Set(state.history.slice(-10).map(x=>x.id));
  const fresh = p.filter(c => !doneIds.has(c.id) && (!current || c.id !== current.id));
  if(fresh.length) p = fresh;
  current = p[Math.floor(Math.random()*p.length)];
  currentBonus = BONUS[Math.floor(Math.random()*BONUS.length)];
  render();
}

function render(){
  const el = document.getElementById("challenge");
  el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
  if(!current){
    el.innerHTML = `<h2>Aucun défi ne correspond</h2><p class="brief">Active au moins un thème et une difficulté dans tes réglages ci-dessous.</p>`;
    document.getElementById("done").disabled = true; return;
  }
  const c = current;
  const dots = [1,2,3].map(i=>`<i class="${i<=c.n?"on":""}"></i>`).join("");
  const note = CAM_NOTE[state.cam][c.nuit?"nuit":"jour"];
  const doneToday = state.history.some(h=>h.id===c.id && h.date===dayKey());
  el.innerHTML = `
    <div class="kind"><span>${THEMES[c.t]}</span><span class="dots" aria-label="Difficulté ${LEVELS[c.n]}">${dots}</span><span>${LEVELS[c.n]}</span></div>
    <h2>${c.titre}</h2>
    <p class="brief">${c.brief}</p>
    <div class="block"><h3>Astuce</h3><p>${c.astuce}</p></div>
    <div class="block"><h3>${CAMS[state.cam]}</h3><p>${note}</p></div>
    <div class="block"><h3>Contrainte bonus, si tu veux corser</h3><p>${currentBonus}</p></div>
    <div class="exif">${c.reg.map(r=>`<span>${r}</span>`).join("")}</div>`;
  const b = document.getElementById("done");
  b.disabled = doneToday; b.textContent = doneToday ? "Réalisé aujourd’hui" : "Je l’ai fait";
}

function streak(){
  const days = new Set(state.history.map(h=>h.date));
  let n=0, d=new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderMeta(){
  const total = state.history.length, s = streak();
  document.getElementById("stats").innerHTML = `<b>${total}</b> défi${total>1?"s":""} réalisé${total>1?"s":""}<br><b>${s}</b> jour${s>1?"s":""} d’affilée`;
  const ul = document.getElementById("history");
  ul.innerHTML = total ? state.history.slice().reverse().map(h=>{
    const d = new Date(h.date+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
    return `<li><span>${h.titre}</span><time datetime="${h.date}">${d}</time></li>`;
  }).join("") : `<li class="empty">Ton premier défi réalisé apparaîtra ici.</li>`;
}

function chips(id, map, isOn, onClick){
  const box = document.getElementById(id);
  box.innerHTML = "";
  Object.entries(map).forEach(([k,label])=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", isOn(k));
    b.onclick = ()=>{ onClick(k); save(); renderChips(); if(id!=="cams") pickRandom(); else render(); };
    box.appendChild(b);
  });
}
function toggle(arr,k){ const i=arr.indexOf(k); i>=0 ? arr.splice(i,1) : arr.push(k); }
function renderChips(){
  chips("themes", THEMES, k=>state.themes.includes(k), k=>toggle(state.themes,k));
  chips("levels", LEVELS, k=>state.levels.includes(k), k=>toggle(state.levels,k));
  chips("cams", CAMS, k=>state.cam===k, k=>{state.cam=k;});
}

document.getElementById("next").onclick = pickRandom;
document.getElementById("today").onclick = pickToday;
document.getElementById("done").onclick = ()=>{
  if(!current) return;
  state.history.push({id:current.id, titre:current.titre, date:dayKey()});
  save(); renderMeta(); render();
};
document.getElementById("reset").onclick = ()=>{
  if(confirm("Effacer tout l’historique des défis réalisés ?")){ state.history=[]; save(); renderMeta(); render(); }
};

renderChips(); renderMeta(); pickToday();
</script>
</body>
</html>
